<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>电创导航 · 资料工作台</title>
  <meta name="description" content="方案 A 原型：左侧分类目录、中间结果列表、右侧资料详情的三栏工作台。">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4efe4">
  <link rel="icon" href="assets/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" href="assets/favicon.png" sizes="48x48">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="workbench.css">
</head>
<body>
  <a class="skip-link" href="#results-title" id="skip-link">跳到资料列表</a>

  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <!-- Lucide icons (MIT) -->
    <symbol id="i-chip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
      <rect width="16" height="16" x="4" y="4" rx="2"/><rect width="8" height="8" x="8" y="8" rx="1"/>
      <path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/>
    </symbol>
    <symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
      <path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>
    </symbol>
    <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
    </symbol>
    <symbol id="i-archive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
      <rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/>
    </symbol>
    <symbol id="i-manual" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M8 7h6M8 11h8"/>
    </symbol>
    <symbol id="i-tool" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </symbol>
    <symbol id="i-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
      <rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/>
      <rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12 19-7-7 7-7M19 12H5"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18M6 6l12 12"/>
    </symbol>
    <symbol id="i-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
    </symbol>
    <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h16M4 12h16M4 18h16"/>
    </symbol>
    <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 15-6-6-6 6"/>
    </symbol>
    <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/>
    </symbol>
  </svg>

  <div class="app" id="app">
    <!-- ═══ 顶栏：品牌 + 全局搜索 ═══ -->
    <header class="topbar">
      <button class="nav-toggle" id="nav-toggle" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="sidebar">
        <svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg>
        <span class="visually-hidden">打开分类目录</span>
      </button>
      <a class="brand" href="#/" id="brand-home" aria-label="电创导航，回到全部资料">
        <img src="assets/logo.png" width="34" height="34" alt="">
        <span class="brand-text">
          <b class="brand-name">电创导航</b>
          <i class="brand-sub">资料工作台 · 大学生电子创新协会</i>
        </span>
      </a>
      <div class="search" role="search">
        <label class="search-box" for="q">
          <svg class="ic search-ic" aria-hidden="true"><use href="#i-search"/></svg>
          <span class="visually-hidden">搜索资料名称、说明或标签</span>
          <input id="q" type="search" placeholder="搜索名称、说明或标签…" title="按 / 快速搜索，Esc 清除" aria-keyshortcuts="/" autocomplete="off" enterkeyhint="search">
        </label>
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
        <button class="search-clear" id="q-clear" type="button" aria-label="清除搜索" hidden>
          <svg class="ic" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <p class="top-stats" id="top-stats" aria-label="收录统计"></p>
    </header>

    <div class="workbench">
      <!-- ═══ 左栏：分类目录 + 当前分类资料目录 ═══ -->
      <aside class="sidebar" id="sidebar" aria-label="分类与资料目录">
        <div class="sidebar-head mobile-only">
          <span class="pane-kicker">INDEX / 目录</span>
          <button class="icon-btn" id="sidebar-close" type="button" aria-label="关闭目录">
            <svg class="ic" aria-hidden="true"><use href="#i-close"/></svg>
          </button>
        </div>
        <div class="sidebar-scroll">
          <nav class="cat-nav" aria-label="分类">
            <p class="pane-kicker desktop-only">CATEGORIES / 分类</p>
            <ul class="cat-list" id="cat-list"></ul>
          </nav>
          <section class="outline" id="outline" aria-label="当前分类的资料目录">
            <p class="pane-kicker" id="outline-kicker">OUTLINE / 目录</p>
            <div id="outline-body"></div>
          </section>
          <p class="sidebar-note" id="site-note"></p>
        </div>
      </aside>
      <div class="scrim" id="scrim" hidden></div>

      <!-- ═══ 中栏：结果列表 ═══ -->
      <main class="results" id="results" aria-label="资料列表">
        <div class="results-head">
          <p class="pane-kicker" id="results-kicker">ALL / 全部资料</p>
          <div class="results-title-row">
            <h1 id="results-title" tabindex="-1">全部资料</h1>
            <span class="results-count" id="results-count"></span>
          </div>
          <p class="results-desc" id="results-desc"></p>
          <p class="search-status" id="search-status" role="status" hidden></p>
        </div>
        <div class="results-scroll" id="results-scroll">
          <ul class="result-list" id="result-list" aria-label="资料条目"></ul>
          <div id="results-empty"></div>
        </div>
        <footer class="results-foot">
          <span class="foot-hint"><kbd>/</kbd> 搜索 · <kbd>↑</kbd><kbd>↓</kbd> 切换条目 · <kbd>Esc</kbd> 返回</span>
        </footer>
      </main>

      <!-- ═══ 右栏：当前资料详情 ═══ -->
      <section class="detail" id="detail" aria-label="资料详情">
        <div class="detail-bar">
          <button class="back-btn mobile-only" id="detail-back" type="button">
            <svg class="ic" aria-hidden="true"><use href="#i-back"/></svg>
            <span>返回列表</span>
          </button>
          <p class="pane-kicker desktop-only" id="detail-kicker">DETAIL / 详情</p>
          <div class="detail-bar-actions">
            <button class="step-btn" id="prev-item" type="button" aria-label="上一条资料" title="上一条（↑）">
              <svg class="ic" aria-hidden="true"><use href="#i-up"/></svg>
            </button>
            <span class="step-pos" id="step-pos" aria-live="polite"></span>
            <button class="step-btn" id="next-item" type="button" aria-label="下一条资料" title="下一条（↓）">
              <svg class="ic" aria-hidden="true"><use href="#i-down"/></svg>
            </button>
            <button class="icon-btn detail-close" id="detail-close" type="button" aria-label="关闭详情" title="关闭详情（Esc）">
              <svg class="ic" aria-hidden="true"><use href="#i-close"/></svg>
            </button>
          </div>
        </div>
        <div class="detail-scroll" id="detail-scroll">
          <article id="detail-body" aria-live="polite"></article>
        </div>
      </section>
    </div>
  </div>

  <noscript><p class="noscript-note">本原型由 JavaScript 渲染，请启用后再查看。</p></noscript>

  <script src="links-data.js"></script>
  <script src="workbench.js"></script>
</body>
</html>
